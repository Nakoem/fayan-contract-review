              - generic [ref=e890]: ▸ 风险说明：单方任意重定利润分配比例，违反民法典972条“合伙事务须协商一致”原则，构成显失公平且实质性剥夺对方财产权益。
              - generic [ref=e893]: ▸ 修改建议：删除单方核定权；改为“任何一方未按约投入资源的，经双方协商一致可调整分配比例；协商不成的，按实际投入资源价值占比重新计算，并委托第三方评估机构出具书面报告作为依据。”
