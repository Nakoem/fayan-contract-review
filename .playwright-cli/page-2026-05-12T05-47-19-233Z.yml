              - generic [ref=e899]: ▸ 原文：合作期间产生的全部知识产权包括但不限于专利、软件著作权、技术秘密归甲方所有，乙方享有署名权。
              - generic [ref=e902]: ▸ 风险说明：条款单方独占全部知识产权且未约定对价或合理补偿，违反民法典861条及著作权法19条关于委托开发/创作成果归属的默认规则，显失公平，尤其当乙方实质性贡献技术或创意时。
              - generic [ref=e905]: ▸ 修改建议：明确区分背景知识产权与新生成知识产权；对乙方实质性贡献形成的专利、软件著作权等，应约定共有或甲方有偿受让，并设定合理对价、许可使用范围或收益分成机制；技术秘密归属需以保密义务和实际控制为前提，不得笼统剥夺乙方合法权益。
