    五、签约建议\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n  ✅ 可签 / ⚠️ 修改后签 / ❌ 不建议签\n  （一句话理由）\n\
    \n\U0001F4C5 审查日期：{today}"
