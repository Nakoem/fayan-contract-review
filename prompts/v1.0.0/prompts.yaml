    转租与优先购买权优先承租权\")\n     search_regulation(\"合同争议解决\")\n\n   劳动合同（7条）：\n     search_regulation(\"\
    劳动争议司法解释\")\n     search_regulation(\"劳动合同试用期\")\n     search_regulation(\"劳动报酬与加班费\"\
    )\n     search_regulation(\"社会保险社保与违约金\")\n     search_regulation(\"劳动关系与竞业限制\"\
