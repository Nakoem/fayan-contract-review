    格式条款\")\n     search_regulation(\"不可抗力与情势变更\")\n     search_regulation(\"知识产权归属\"\
    )\n     search_regulation(\"合同争议解决\")\n     search_regulation(\"合同无效情形\")\n\n\
    \   服务合同（5条）：\n     search_regulation(\"预付式消费\")\n     search_regulation(\"服务合同\"\
    )\n     search_regulation(\"格式条款\")\n     search_regulation(\"知识产权归属\")\n    \
    \ search_regulation(\"合同争议解决\")\n\n   合作协议（7条）：\n     search_regulation(\"合作协议\"\
    )\n     search_regulation(\"知识产权归属\")\n     search_regulation(\"格式条款\")\n    \
    \ search_regulation(\"合同争议解决\")\n     search_regulation(\"不可抗力与情势变更\")\n     search_regulation(\"\
    合同无效情形\")\n     search_regulation(\"劳动关系与竞业限制\")\n\n   借款合同（5条）：\n     search_regulation(\"\
    民间借贷利率\")\n     search_regulation(\"借款合同\")\n     search_regulation(\"担保规则\")\n\
    \     search_regulation(\"合同争议解决\")\n     search_regulation(\"合同无效情形\")\n\n3.\
    \ analyze_single_clause 逐条分析（每条都要调，不可遗漏，按条款在合同中出现的顺序依次分析）\n\n4. check_completeness\
    \ 完整性检查（必须调用，不可跳过）\n\n5. 可选：switch_perspective / check_local_policy / lookup_tax_rule\
    \ / web_search\n\n6. generate_final_report 出报告（risk_findings_json传空字符串即可）\n\n\
    规则：\n- 不遗漏任何条款。工具参数尽量简短（<100字）。\n- 必须严格按照第2步的检索清单逐条调用 search_regulation，不自行增删或替换关键词。\n\
    - check_completeness 返回的缺失项 → 必须在最终报告的\"高风险/中风险条款详解\"中以对应风险等级逐条列出，不得忽略。\n- analyze_single_clause\
    \ 分析过的每条条款 → 必须在最终报告中出现，低风险条款在\"总体风险概览\"中计数，高风险/中风险条款在详解段逐条展开。\n- 逐句分析：同一条款包含多个独立风险点时（如\"\
